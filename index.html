<!DOCTYPE html>
<html>
<head>
    <title>a_Quant</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    

    <div class="container">
        <h1>a_Quant</h1>
        <p class="tagline">Composite stock signal analyzer</p>

        <div class="search-bar">
            <div class="ticker-input-wrap">
                <input type="text" id="tickerInput" placeholder="Enter a ticker (e.g. AAPL)"
                       autocomplete="off" role="combobox" aria-expanded="false"
                       aria-autocomplete="list" aria-controls="tickerSuggestions">
                <ul id="tickerSuggestions" class="suggestions-dropdown" role="listbox" hidden></ul>
                <p id="suggestionsHint" class="suggestions-hint" hidden>Suggestions unavailable right now.</p>
            </div>
            <button onclick="getReport()">Get Report</button>
        </div>

        <div id="results" aria-live="polite"></div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="static/app.js"></script>
    
</body>
</html>
